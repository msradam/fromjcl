[project]
name = "fromjcl"
version = "0.5.0"
description = "Parse IBM z/OS JCL and serialize to JSON, YAML, CSV, or roundtrip JCL."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Adam Munawar Rahman", email = "msrahmanadam@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["jcl", "zos", "z/os", "mainframe", "ibm", "mvs", "parser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Systems Administration",
    "Topic :: Text Processing",
]
# Base install ships the JCL parser plus JSON / YAML / CSV / JCL roundtrip
# emitters. Pure-Python, installable under IBM Open Enterprise Python on
# z/OS as well as Linux/macOS/Windows.
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# `pip install fromjcl[zoau]` enables `--to zoau` / `--to mvscmd` and
# pulls in bashlex so the emitted shell can be structurally validated
# (every flag must appear in the frozen ZOAU 1.x manpage table).
#
# EXPERIMENTAL: ZOAU shell emission is best-effort. Output is marked as
# such with a banner comment, and bashlex catches flag typos — it does
# not verify semantic equivalence to the source JCL.
zoau = [
    "bashlex>=0.18",
]

[project.urls]
Homepage = "https://github.com/msradam/fromjcl"
Repository = "https://github.com/msradam/fromjcl"
Issues = "https://github.com/msradam/fromjcl/issues"

[dependency-groups]
# Runtime test deps. Pure Python, install on z/OS.
test = [
    "pytest>=9.0.3",  # CVE-2025-71176
    "bashlex>=0.18",
]
# Workstation dev tooling. ruff and uv are Rust binaries with no z/OS
# wheel, so this group is for Linux/macOS/Windows development only.
dev = [
    "ruff",
    "mypy",
    "types-pyyaml",
    "vulture",
    "radon>=6.0.1",
    "interrogate>=1.7",
    "pygments>=2.20.0",  # CVE-2026-4539
    "bandit>=1.7",
    "pip-audit>=2.7",
    "twine>=5.0",
    "refurb>=2.3.1",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fromjcl = "fromjcl.cli:main"

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "S", "FURB"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "SIM115"]
# Generated table of ZOAU flag names. Long lines are intrinsic.
"src/fromjcl/_zoau_flags.py" = ["E501"]

[tool.ruff.format]

# --- Mypy ---
[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
mypy_path = "src"

# --- Vulture ---
[tool.vulture]
min_confidence = 80
paths = ["src/", "tests/"]
# `synthetic`, `src_dataset` and the JOB-card fields (account,
# programmer, class_, msgclass, msglevel, notify, region) are accessed
# via dataclass `asdict()` serialisation or runtime string lookup
# (`stmt.get("synthetic")`), neither of which vulture can trace.
ignore_names = [
    "indentless", "inputFile",
    "synthetic",
    "src_dataset",
    "region", "account", "programmer", "class_",
    "msgclass", "msglevel", "notify",
    "instream_dlm",
]

# --- Interrogate ---
[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = true
ignore-semiprivate = true
ignore-nested-functions = true
exclude = ["src/fromjcl/_scanner.py", "src/fromjcl/_zoau_flags.py"]

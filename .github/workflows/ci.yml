name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Install [zoau] extra (needed for zoau-gated tests)
        run: uv pip install bashlex

      - name: Run quality gate
        run: tests/check.sh

      - name: Static security scan (bandit)
        run: uv run bandit -r src/ -ll

      - name: Dependency vulnerability scan (pip-audit)
        # PYSEC-2022-42969: ReDoS in `py.path.svnwc`, not invoked by interrogate.
        run: uv run pip-audit --ignore-vuln PYSEC-2022-42969

      - name: Build wheel + sdist
        run: uv build

      - name: Twine metadata check
        run: uv run twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error

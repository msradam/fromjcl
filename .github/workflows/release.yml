name: Release

# Runs on every `v*` tag and on manual dispatch. Builds the wheel and
# sdist, runs the full quality gate, verifies metadata with twine, and
# publishes to PyPI via Trusted Publisher (OIDC).
#
# One-time setup required: register the Trusted Publisher at
# https://pypi.org/manage/project/fromjcl/settings/publishing/
# with publisher=GitHub, owner=msradam, repo=fromjcl,
# workflow=release.yml, environment=pypi.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Quality gate
        run: tests/check.sh

      - name: Build
        run: uv build

      - name: Twine check
        run: uv run twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

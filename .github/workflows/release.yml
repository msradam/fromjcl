name: Release

# Runs on every `v*` tag and on manual dispatch. Builds the wheel and
# sdist, runs the full quality gate, verifies metadata with twine, and
# uploads the dist as a workflow artifact.
#
# Publishing to PyPI is intentionally manual (`uv run twine upload
# dist/*` from a checkout) until a Trusted Publisher is registered at
# https://pypi.org/manage/project/fromjcl/settings/publishing/. When it
# is, add a publish job that uses pypa/gh-action-pypi-publish with
# permissions.id-token: write.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Quality gate
        run: tests/check.sh

      - name: Build
        run: uv build

      - name: Twine check
        run: uv run twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
